name: 部署 Astro 站点到 GitHub Pages

on:
  # push:
    # branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout

      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          path: . 
          # ✅ 添加下面这一行，指定你本地使用的 pnpm 版本（例如 8 或 9）
          pnpm-version: 9

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      [cite_start]url: ${{ steps.deployment.outputs.page_url }} [cite: 2]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment